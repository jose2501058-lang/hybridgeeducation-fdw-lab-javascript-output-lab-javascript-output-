<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="miParrafo"></p>
    <button onclick="actualizarTexto()">Haz clic aqui</button>

    <script>
        function actualizarTexto() {
            document.getElementById("miParrafo").innerHTML = "Texto actualizado con JS"
        }
    </script>
</body>
</html>
